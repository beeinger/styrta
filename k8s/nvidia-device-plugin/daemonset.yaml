apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: nvidia-device-plugin-daemonset
  namespace: nvidia-device-plugin
spec:
  selector:
    matchLabels:
      name: nvidia-device-plugin-ds
  updateStrategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        name: nvidia-device-plugin-ds
    spec:
      nodeSelector:
        kubernetes.io/os: linux
        accelerator: nvidia
      tolerations:
        - key: "nvidia.com/gpu"
          operator: "Exists"
          effect: "NoSchedule"
      containers:
        - name: nvidia-device-plugin-ctr
          image: nvcr.io/nvidia/k8s-device-plugin:v0.15.0
          args:
            - "--fail-on-init-error=false"
          env:
            - name: NVIDIA_DRIVER_ROOT
              value: /driver-root
            - name: LD_LIBRARY_PATH
              value: /opt/nvidia/lib:/driver-root/usr/lib/x86_64-linux-gnu/nvidia/current:/driver-root/usr/lib/x86_64-linux-gnu/nvidia
          securityContext:
            privileged: true
          volumeMounts:
            - name: device-plugin
              mountPath: /var/lib/kubelet/device-plugins
            - name: driver-root
              mountPath: /driver-root
              readOnly: true
            - name: nvidia-ml-so
              mountPath: /opt/nvidia/lib/libnvidia-ml.so.1
              readOnly: true
            - name: nvidia-ml-so-link
              mountPath: /opt/nvidia/lib/libnvidia-ml.so
              readOnly: true
      volumes:
        - name: device-plugin
          hostPath:
            path: /var/lib/kubelet/device-plugins
        - name: driver-root
          hostPath:
            path: /
        - name: nvidia-ml-so
          hostPath:
            path: /lib/x86_64-linux-gnu/libnvidia-ml.so.1
            type: File
        - name: nvidia-ml-so-link
          hostPath:
            path: /lib/x86_64-linux-gnu/libnvidia-ml.so
            type: File
