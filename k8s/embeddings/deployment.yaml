# CPU text embeddings. OpenAI-compatible POST /v1/embeddings, GET /health.
# No GPU. Weights download into the PVC on first start.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: text-embeddings
  namespace: embeddings
  labels:
    app.kubernetes.io/name: text-embeddings
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: text-embeddings
  template:
    metadata:
      labels:
        app.kubernetes.io/name: text-embeddings
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      containers:
        - name: text-embeddings
          image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.9.4
          imagePullPolicy: IfNotPresent
          args:
            - --model-id
            - intfloat/multilingual-e5-large
            - --port
            - "80"
            - --huggingface-hub-cache
            - /data
            - --max-concurrent-requests
            - "8"
            - --max-batch-tokens
            - "2048"
          ports:
            - name: http
              containerPort: 80
          env:
            - name: HUGGINGFACE_HUB_CACHE
              value: /data
            - name: HF_HOME
              value: /data
          resources:
            requests:
              cpu: "2"
              memory: 4Gi
            limits:
              cpu: "2"
              memory: 4Gi
          volumeMounts:
            - name: model-cache
              mountPath: /data
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 180
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
      volumes:
        - name: model-cache
          persistentVolumeClaim:
            claimName: embeddings-model
