# Not applied. Load order: empty database, pg_restore of the verified dump, then migration 002.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: serve
  namespace: styrta
  labels:
    app.kubernetes.io/name: serve
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: serve
  template:
    metadata:
      labels:
        app.kubernetes.io/name: serve
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      containers:
        - name: serve
          image: styrta-serve:local
          imagePullPolicy: IfNotPresent
          command: ["serve"]
          ports:
            - name: http
              containerPort: 8088
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: serve
                  key: DATABASE_URL
            - name: STYRTA_WORK_DIR
              valueFrom:
                secretKeyRef:
                  name: serve
                  key: STYRTA_WORK_DIR
            - name: OPENAI_BASE_URL
              valueFrom:
                secretKeyRef:
                  name: serve
                  key: OPENAI_BASE_URL
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: serve
                  key: OPENAI_API_KEY
            - name: OPENAI_MODEL
              valueFrom:
                secretKeyRef:
                  name: serve
                  key: OPENAI_MODEL
            - name: OPENAI_TIMEOUT_SECS
              valueFrom:
                secretKeyRef:
                  name: serve
                  key: OPENAI_TIMEOUT_SECS
            - name: OPENAI_USER_AGENT
              valueFrom:
                secretKeyRef:
                  name: serve
                  key: OPENAI_USER_AGENT
            - name: SPEECH_BASE_URL
              valueFrom:
                secretKeyRef:
                  name: serve
                  key: SPEECH_BASE_URL
            - name: SPEECH_API_KEY
              valueFrom:
                secretKeyRef:
                  name: serve
                  key: SPEECH_API_KEY
            - name: STT_MODEL
              valueFrom:
                secretKeyRef:
                  name: serve
                  key: STT_MODEL
            - name: TTS_MODEL
              valueFrom:
                secretKeyRef:
                  name: serve
                  key: TTS_MODEL
            - name: TTS_VOICE
              valueFrom:
                secretKeyRef:
                  name: serve
                  key: TTS_VOICE
            - name: EMBED_BASE_URL
              valueFrom:
                secretKeyRef:
                  name: serve
                  key: EMBED_BASE_URL
            - name: EMBED_API_KEY
              valueFrom:
                secretKeyRef:
                  name: serve
                  key: EMBED_API_KEY
            - name: EMBED_MODEL
              valueFrom:
                secretKeyRef:
                  name: serve
                  key: EMBED_MODEL
            - name: EMBED_QUERY_PREFIX
              valueFrom:
                secretKeyRef:
                  name: serve
                  key: EMBED_QUERY_PREFIX
            - name: EMBED_PASSAGE_PREFIX
              valueFrom:
                secretKeyRef:
                  name: serve
                  key: EMBED_PASSAGE_PREFIX
            - name: STYRTA_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: serve
                  key: STYRTA_JWT_SECRET
            - name: STYRTA_AUDIO_DIR
              valueFrom:
                secretKeyRef:
                  name: serve
                  key: STYRTA_AUDIO_DIR
          resources:
            requests:
              cpu: "500m"
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
