apiVersion: apps/v1
kind: Deployment
metadata:
  name: serve
  namespace: styrta
  labels:
    app.kubernetes.io/name: serve
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: serve
  template:
    metadata:
      labels:
        app.kubernetes.io/name: serve
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      containers:
        - name: serve
          image: 192.168.10.3:30500/styrta-serve:20261004
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8088
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: serve
                  key: DATABASE_URL
            - name: LLM_BASE_URL
              valueFrom:
                secretKeyRef:
                  name: serve
                  key: LLM_BASE_URL
            - name: LLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: serve
                  key: LLM_API_KEY
            - name: LLM_MODEL
              valueFrom:
                secretKeyRef:
                  name: serve
                  key: LLM_MODEL
            - name: LLM_TIMEOUT_SECS
              valueFrom:
                secretKeyRef:
                  name: serve
                  key: LLM_TIMEOUT_SECS
            - name: LLM_USER_AGENT
              valueFrom:
                secretKeyRef:
                  name: serve
                  key: LLM_USER_AGENT
            - name: SPEECH_BASE_URL
              valueFrom:
                secretKeyRef:
                  name: serve
                  key: SPEECH_BASE_URL
            - name: SPEECH_API_KEY
              valueFrom:
                secretKeyRef:
                  name: serve
                  key: SPEECH_API_KEY
            - name: STT_MODEL
              valueFrom:
                secretKeyRef:
                  name: serve
                  key: STT_MODEL
            - name: TTS_MODEL
              valueFrom:
                secretKeyRef:
                  name: serve
                  key: TTS_MODEL
            - name: TTS_VOICE
              valueFrom:
                secretKeyRef:
                  name: serve
                  key: TTS_VOICE
            - name: EMBED_BASE_URL
              valueFrom:
                secretKeyRef:
                  name: serve
                  key: EMBED_BASE_URL
            - name: EMBED_API_KEY
              valueFrom:
                secretKeyRef:
                  name: serve
                  key: EMBED_API_KEY
            - name: EMBED_MODEL
              valueFrom:
                secretKeyRef:
                  name: serve
                  key: EMBED_MODEL
            - name: EMBED_QUERY_PREFIX
              valueFrom:
                secretKeyRef:
                  name: serve
                  key: EMBED_QUERY_PREFIX
            - name: EMBED_PASSAGE_PREFIX
              valueFrom:
                secretKeyRef:
                  name: serve
                  key: EMBED_PASSAGE_PREFIX
            - name: STYRTA_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: serve
                  key: STYRTA_JWT_SECRET
            - name: STYRTA_AUDIO_DIR
              valueFrom:
                secretKeyRef:
                  name: serve
                  key: STYRTA_AUDIO_DIR
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 24
          volumeMounts:
            - name: audio
              mountPath: /var/lib/styrta/audio
      volumes:
        - name: audio
          persistentVolumeClaim:
            claimName: serve-audio
