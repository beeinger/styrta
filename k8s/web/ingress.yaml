# HTTPS via Traefik + Let's Encrypt (cert resolver name: default).
# DNS: styrta.energia.dev → cluster; WAN 80/443 → Traefik.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: web
  namespace: styrta
  labels:
    app.kubernetes.io/name: web
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    traefik.ingress.kubernetes.io/router.tls.certresolver: default
spec:
  ingressClassName: traefik
  rules:
    - host: styrta.energia.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web
                port:
                  number: 80
  tls:
    - hosts:
        - styrta.energia.dev
