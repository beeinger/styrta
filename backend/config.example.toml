# Environment variables both binaries read. Put real values in backend/.env (not committed).
# Chat, speech, and embeddings are three endpoints. Each has its own base URL and key.
# An empty speech or embed key sends no Authorization header.

# DATABASE_URL="postgres://styrta:password@127.0.0.1:5432/styrta"
# STYRTA_WORK_DIR="/tmp/styrta-ingest"
# LLM_BASE_URL="http://127.0.0.1:9/v1"
# LLM_API_KEY="replace-me"
# LLM_MODEL="replace-me"
# LLM_TIMEOUT_SECS="120"
# Optional chat User-Agent. Empty or unset sends no User-Agent header.
# LLM_USER_AGENT=""
# SPEECH_BASE_URL="http://127.0.0.1:9/v1"
# SPEECH_API_KEY=""
# STT_MODEL="replace-me"
# TTS_MODEL="replace-me"
# TTS_VOICE="replace-me"
# EMBED_BASE_URL="http://127.0.0.1:9/v1"
# EMBED_API_KEY=""
# EMBED_MODEL="replace-me"
# EMBED_QUERY_PREFIX="query: "
# EMBED_PASSAGE_PREFIX="passage: "
# STYRTA_JWT_SECRET="replace-me"
# STYRTA_AUDIO_DIR="/var/lib/styrta/audio"
