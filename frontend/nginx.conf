server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Matches the API audio body limit.
    client_max_body_size 20m;

    # Resolved at request time. A name in proxy_pass is looked up once at start,
    # and the pod would crash if cluster DNS was not ready yet.
    resolver ${NGINX_RESOLVER} valid=10s ipv6=off;

    # Same-origin proxy. Buffering off so chat SSE is not held until the turn ends.
    location /v1/ {
        set $api_upstream serve.styrta.svc.cluster.local:8088;
        proxy_pass http://$api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
        gzip off;
    }

    location /_expo/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
